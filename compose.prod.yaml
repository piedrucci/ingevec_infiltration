services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.production
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
    depends_on:
      - api
      - keycloak
    expose:
      - "80"
    restart: unless-stopped

  api:
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
  pdf-worker:
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
  nats:
    deploy:
      resources:
        limits:
          memory: 256M
  redis:
    deploy:
      resources:
        limits:
          memory: 128M
  seaweedfs:
    deploy:
      resources:
        limits:
          memory: 512M
  keycloak:
    command: start --import-realm
    volumes:
      - ./infra/keycloak/realm-production.json:/opt/keycloak/data/import/realm-production.json:ro
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 1G
  superset:
    expose:
      - "8088"
    deploy:
      resources:
        limits:
          memory: 2G
  superset-db:
    deploy:
      resources:
        limits:
          memory: 512M
