services:
  api:
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/app:/app/app
  pdf-worker:
    volumes:
      - ./apps/api/app:/app/app
  nats:
    ports:
      - "8222:8222"
  seaweedfs:
    ports:
      - "8333:8333"
      # Filer UI for local developer administration only; it is not protected
      # by Keycloak and must never be published in the production overlay.
      - "127.0.0.1:8888:8888"
  keycloak:
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-development.json:/opt/keycloak/data/import/realm-development.json:ro
  superset:
    ports:
      - "8088:8088"
