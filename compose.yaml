name: capix-ingevec

services:
  api:
    build:
      context: .
      target: runtime
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env.${APP_ENV:?Set APP_ENV through the selected environment file}
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      nats:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  pdf-worker:
    build:
      context: .
      target: runtime
    command: python -m app.worker.main
    env_file: .env.${APP_ENV:?Set APP_ENV through the selected environment file}
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - nats_data:/data
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:3.81
    command: server -s3 -dir=/data -ip=seaweedfs -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=http://localhost:5173,https://app.capix.cloud
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak-db:
        condition: service_started
    restart: unless-stopped

  superset:
    build:
      context: .
      dockerfile: infra/superset/Dockerfile
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/ingevec/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD}@superset-db:5432/superset
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME}
      SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
    command:
      - /bin/sh
      - -c
      - >-
        superset db upgrade &&
        (superset fab create-admin
        --username "$$SUPERSET_ADMIN_USERNAME"
        --firstname "$$SUPERSET_ADMIN_FIRSTNAME"
        --lastname "$$SUPERSET_ADMIN_LASTNAME"
        --email "$$SUPERSET_ADMIN_EMAIL"
        --password "$$SUPERSET_ADMIN_PASSWORD" || true) &&
        superset init &&
        /usr/bin/run-server.sh
    volumes:
      - ./infra/superset:/app/pythonpath/ingevec:ro
      - superset_home:/app/superset_home
    depends_on:
      superset-db:
        condition: service_healthy
    restart: unless-stopped

  superset-provisioner:
    build:
      context: .
      dockerfile: infra/superset/Dockerfile
    profiles: ["provision"]
    env_file: .env.${APP_ENV:?Set APP_ENV through the selected environment file}
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/ingevec/superset_config.py
      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD}@superset-db:5432/superset
    command: python /app/pythonpath/ingevec/configure_analytics.py
    volumes:
      - ./infra/superset:/app/pythonpath/ingevec:ro
    depends_on:
      superset-db:
        condition: service_healthy

  superset-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  nats_data:
  redis_data:
  seaweedfs_data:
  keycloak_data:
  superset_db_data:
  superset_home:
